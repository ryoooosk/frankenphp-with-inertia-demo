name: CI

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || 'manual' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # Laravelのパッケージ検出とオートローダー最適化のために必要
      - name: Create cache directory
        run: mkdir -p bootstrap/cache
        working-directory: ./src

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
        working-directory: ./src

      - name: "Restore result cache"
        uses: actions/cache/restore@v6
        with:
          path: src/vendor/phpstan/phpstan/tmp # phpstan.neonのtmpDirと合わせる
          key: "phpstan-result-cache-${{ env.PR_NUMBER }}"
          # 一致するキャッシュの内最新のものを使用する
          restore-keys: |
            phpstan-result-cache-

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --error-format=github
        working-directory: ./src

      - name: "Save result cache"
        uses: actions/cache/save@v6
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        with:
          path: src/vendor/phpstan/phpstan/tmp # phpstan.neonのtmpDirと合わせる
          key: "phpstan-result-cache-${{ env.PR_NUMBER }}"

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            ./src/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Create cache directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
        working-directory: ./src

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
        working-directory: ./src

      - name: Copy .env file
        run: cp .env.ci .env
        working-directory: ./src

      - name: Generate application key
        run: php artisan key:generate
        working-directory: ./src

      - name: Generate Passport keys
        run: php artisan passport:keys
        working-directory: ./src

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: ./src/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install npm dependencies
        run: npm i
        working-directory: ./src

      - name: Build assets
        run: npm run build
        working-directory: ./src

      - name: Cache PHPUnit result cache
        uses: actions/cache@v6
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'manual' }}
        with:
          path: ./src/.phpunit.result.cache
          key: ${{ runner.os }}-phpunit-result-cache-${{ env.PR_NUMBER }}
          restore-keys: |
            ${{ runner.os }}-phpunit-result-cache-

      - name: Run PHPUnit
        run: composer run test
        working-directory: ./src
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
